[project]
name = "tracklab"
version = "0.1.0"
description = "TrackLab: motor local do estúdio de estudo de guitarra (Songsterr, pacotes de música, separação)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.115.0",
    "numpy>=1.26.4",
    # O demucs no Intel exige numpy 1.x (torch 2.2.2 é o último para macOS x86_64).
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "requests>=2.31.0",
    "soundfile>=0.12.1",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp[default]>=2026.10.26",
    "mido>=1.3.3",
]

[project.optional-dependencies]
separate = [
    "demucs==4.1.0",
    # Os acordes pelo som (media/chordsound.py): o CQT do Chord-CNN-LSTM é o do librosa. No Intel, o numba e o llvmlite
    # mais novos não têm roda para macOS x86_64 (o pip tentava compilar o llvmlite e falhava).
    "librosa>=0.10.2",
    "numba<0.61; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.44; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
tracklab = "tracklab.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
